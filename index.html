<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>光的冒险 · Light Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:radial-gradient(ellipse at 50% 30%,#10173a 0%,#050816 60%,#02040c 100%);
  color:#eaf0ff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.hidden{display:none !important;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}

/* ---------- 顶部栏 ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(10,16,40,.85);
  border-bottom:1px solid rgba(120,160,255,.25);z-index:5;flex-wrap:wrap;}
#topTitle{font-size:16px;font-weight:700;color:#ffe08a;flex:1;min-width:120px;text-shadow:0 0 8px rgba(255,210,100,.6);}
.tbtn{border:1px solid rgba(140,180,255,.5);background:rgba(30,45,90,.7);color:#dfe9ff;border-radius:12px;
  padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.tbtn:active{transform:scale(.94);}
.tbtn.glow{background:linear-gradient(135deg,#ffcf5c,#ff9d3c);color:#3a2200;font-weight:700;border:none;
  box-shadow:0 0 14px rgba(255,190,80,.7);animation:pulse 1.6s infinite;}
.tbtn:disabled{opacity:.4;animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(255,190,80,.5);}50%{box-shadow:0 0 20px rgba(255,190,80,.95);}}

/* ---------- 画布 ---------- */
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;}
#cv{background:transparent;border-radius:10px;touch-action:none;max-width:100%;max-height:100%;}

/* ---------- 底部操作栏 ---------- */
#actionbar{display:flex;gap:10px;justify-content:center;align-items:center;padding:8px 10px 12px;flex-wrap:wrap;}
#levelInfo{font-size:13px;color:#9fb4e8;width:100%;text-align:center;min-height:18px;}

/* ---------- 地图 ---------- */
#scrMap{background:
  radial-gradient(1px 1px at 12% 22%,#fff8,transparent),
  radial-gradient(1px 1px at 68% 12%,#fff6,transparent),
  radial-gradient(2px 2px at 85% 40%,#ffd16688,transparent),
  radial-gradient(1px 1px at 30% 70%,#fff5,transparent),
  radial-gradient(2px 2px at 50% 88%,#8ecae677,transparent),
  radial-gradient(ellipse at 50% 20%,#131c48 0%,#050816 70%);
  overflow-y:auto;padding:14px;}
#mapHead{text-align:center;margin:6px 0 4px;}
#mapHead h1{font-size:26px;color:#ffe08a;text-shadow:0 0 16px rgba(255,210,100,.8);letter-spacing:2px;}
#mapHead p{font-size:13px;color:#9fb4e8;margin-top:4px;}
#mapGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:900px;margin:12px auto 30px;width:100%;}
.wcard{background:rgba(20,30,66,.75);border:1px solid rgba(120,160,255,.3);border-radius:16px;padding:12px;
  text-align:center;position:relative;transition:.2s;}
.wcard.locked{opacity:.45;filter:grayscale(.7);}
.wcard .lh{font-size:40px;line-height:1.2;filter:drop-shadow(0 0 2px #000);}
.wcard.lit .lh{filter:drop-shadow(0 0 14px gold);}
.wcard h3{font-size:15px;color:#ffe9b0;margin:4px 0 2px;}
.wcard .wsub{font-size:11px;color:#93a7dd;margin-bottom:8px;}
.lvbtn{display:inline-block;margin:3px;padding:6px 9px;border-radius:10px;border:1px solid rgba(140,180,255,.4);
  background:rgba(35,50,100,.8);color:#dfe9ff;font-size:13px;cursor:pointer;min-width:44px;}
.lvbtn.done{border-color:#ffd166;color:#ffd166;}
.lvbtn.lock{opacity:.35;pointer-events:none;}
#mapBtns{text-align:center;padding-bottom:24px;}
#mapBtns .tbtn{margin:4px;font-size:15px;padding:10px 18px;}

/* ---------- 图鉴 ---------- */
#scrJournal{background:rgba(5,8,22,.97);overflow-y:auto;padding:14px;z-index:20;}
#journalGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:960px;margin:10px auto;width:100%;}
.jcard{background:linear-gradient(160deg,#1b2752,#101a3d);border:1px solid rgba(255,210,120,.4);border-radius:14px;padding:10px;min-height:150px;}
.jcard .ji{font-size:30px;text-align:center;filter:drop-shadow(0 0 8px rgba(255,220,150,.6));}
.jcard h4{font-size:13px;color:#ffe08a;text-align:center;margin:6px 0 4px;}
.jcard p{font-size:11.5px;color:#c8d6f8;line-height:1.55;}
.jcard.lock{filter:grayscale(1);opacity:.4;}
.jcard.lock p{visibility:hidden;}

/* ---------- 弹窗 ---------- */
#modalLayer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,12,.72);z-index:50;padding:16px;}
#modalLayer.show{display:flex;}
.modal{background:linear-gradient(165deg,#1a2450,#0d1430);border:1px solid rgba(255,210,120,.5);border-radius:20px;
  max-width:440px;width:100%;padding:22px 20px;text-align:center;box-shadow:0 0 40px rgba(80,120,255,.35);max-height:88vh;overflow-y:auto;}
.modal h2{color:#ffe08a;font-size:20px;margin-bottom:8px;text-shadow:0 0 10px rgba(255,210,100,.6);}
.modal p{font-size:14.5px;line-height:1.7;color:#dce6ff;margin:8px 0;}
.modal .stars{font-size:34px;letter-spacing:6px;margin:6px 0;filter:drop-shadow(0 0 8px gold);}
.optBtn{display:block;width:100%;margin:10px 0;padding:13px;border-radius:14px;font-size:16px;cursor:pointer;
  border:1px solid rgba(140,180,255,.5);background:rgba(40,60,120,.8);color:#eaf0ff;font-family:inherit;}
.optBtn:active{transform:scale(.97);}
.optBtn.right{background:linear-gradient(135deg,#3ddc84,#1fa35a);border:none;font-weight:700;}
.optBtn.wrong{background:linear-gradient(135deg,#ff6b6b,#c92a2a);border:none;font-weight:700;}
.cardShow{background:linear-gradient(160deg,#232f63,#121c44);border:1px solid rgba(255,210,120,.6);border-radius:14px;
  padding:12px;margin:10px 0;}
.cardShow .ji{font-size:36px;}
.cardShow h4{color:#ffe08a;margin:6px 0;}
.cardShow p{font-size:13px;color:#c8d6f8;}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,30,66,.95);
  border:1px solid rgba(255,210,120,.6);color:#ffe9b0;padding:10px 20px;border-radius:14px;font-size:14px;
  z-index:99;display:none;max-width:88vw;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.hintTag{display:inline-block;background:#2a3a78;border-radius:8px;padding:2px 8px;font-size:12px;color:#9fd0ff;margin-bottom:6px;}

/* ---------- 序章 ---------- */
#scrPrologue{background:radial-gradient(ellipse at 50% 30%,#1a2450 0%,#0a0f28 60%,#04060f 100%);z-index:30;
  align-items:center;justify-content:center;text-align:center;padding:24px;}
#proCard{max-width:520px;width:100%;}
#proEmoji{font-size:64px;filter:drop-shadow(0 0 18px rgba(255,220,130,.8));animation:floaty 2.4s ease-in-out infinite;}
#proText{font-size:16.5px;line-height:1.9;color:#eaf0ff;margin:22px 0;min-height:120px;}
#proText b{color:#ffe08a;}
#proDots{margin:10px 0 18px;font-size:13px;color:#9fb4e8;letter-spacing:4px;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* ---------- 结局 ---------- */
#scrEnding{background:radial-gradient(ellipse at 50% 18%,#3a2f10 0%,#141b3e 45%,#050816 100%);z-index:31;
  overflow-y:auto;padding:20px;text-align:center;}
#scrEnding h1{font-size:26px;color:#ffe08a;text-shadow:0 0 20px rgba(255,210,100,.9);margin:8px 0;}
#endRecap{max-width:560px;margin:14px auto;text-align:left;background:rgba(15,22,52,.8);
  border:1px solid rgba(255,210,120,.4);border-radius:16px;padding:14px 18px;}
#endRecap li{font-size:13.5px;color:#dce6ff;line-height:1.8;margin:4px 0;list-style:none;}
#endRecap li b{color:#ffd166;}
#endSouyang{max-width:560px;margin:10px auto;font-size:14px;line-height:2;color:#c8ffd8;}

/* ---------- 卷轴收集动画 ---------- */
@keyframes cardPop{0%{transform:scale(.2) rotate(-12deg);opacity:0;}60%{transform:scale(1.12) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.cardShow{animation:cardPop .7s cubic-bezier(.2,1.4,.4,1);}
.scrollTag{display:inline-block;background:linear-gradient(135deg,#8a5a1e,#c98a2e);color:#fff4d6;
  border-radius:8px;padding:2px 10px;font-size:12px;margin-bottom:8px;box-shadow:0 0 10px rgba(255,190,80,.5);}

/* ---------- 塔状态 ---------- */
.wcard .tstate{font-size:11px;margin:2px 0 6px;padding:2px 8px;border-radius:8px;display:inline-block;}
.tstate.off{background:#1a1f38;color:#7c89b8;}
.tstate.dim{background:#3a3050;color:#ffd98a;}
.tstate.on{background:#4a3a10;color:#ffe08a;box-shadow:0 0 10px rgba(255,190,80,.5);}
#starBar{width:220px;height:10px;background:#1a2246;border-radius:6px;margin:8px auto 0;overflow:hidden;border:1px solid rgba(140,180,255,.3);}
#starFill{height:100%;background:linear-gradient(90deg,#ffcf5c,#ffe08a);width:0%;transition:width .5s;}
#starTxt{font-size:12px;color:#ffd166;margin-top:4px;}
.spark{ display:inline-block; }
</style>
</head>
<body>
<div id="app">
  <!-- 世界地图 -->
  <div id="scrMap" class="screen">
    <div id="mapHead">
      <h1>✨ 光的冒险 ✨</h1>
      <p>光之国的「太阳棱镜」被暗影迷雾侵蚀而熄灭，七座灯塔接连黯淡……<br>光之学徒，和光之精灵「闪闪」一起，逐塔重燃光明吧！</p>
      <div id="starBar"><div id="starFill"></div></div>
      <div id="starTxt"></div>
    </div>
    <div id="mapGrid"></div>
    <div id="mapBtns">
      <button class="tbtn" id="btnOpenJournal">📜 光之卷轴</button>
      <button class="tbtn hidden" id="btnSandbox">🧪 自由实验室</button>
      <button class="tbtn" id="btnReset">🗑️ 重置进度</button>
    </div>
  </div>

  <!-- 游戏画面 -->
  <div id="scrGame" class="screen hidden">
    <div id="topbar">
      <button class="tbtn" id="btnBack">🗺️ 地图</button>
      <div id="topTitle"></div>
      <button class="tbtn" id="btnHint">💡 提示</button>
      <button class="tbtn" id="btnDemo" disabled>🎬 光路演示</button>
    </div>
    <div id="canvasWrap"><canvas id="cv" width="900" height="600"></canvas></div>
    <div id="actionbar">
      <div id="levelInfo"></div>
      <button class="tbtn glow" id="btnFire">🔦 发射光束</button>
    </div>
  </div>

  <!-- 图鉴 -->
  <div id="scrJournal" class="screen hidden">
    <div id="topbar">
      <button class="tbtn" id="btnJournalBack">⬅️ 返回</button>
      <div id="topTitle2" style="font-size:16px;font-weight:700;color:#ffe08a;flex:1;">📜 光之卷轴 <span id="scrollProg" style="font-size:12px;color:#9fb4e8"></span></div>
    </div>
    <div id="journalGrid"></div>
  </div>
  <!-- 序章 -->
  <div id="scrPrologue" class="screen hidden">
    <div id="proCard">
      <div id="proEmoji">✨</div>
      <div id="proText"></div>
      <div id="proDots"></div>
      <button class="tbtn glow" id="btnProNext" style="font-size:16px;padding:12px 30px;">下一页 ▶</button>
      <div style="margin-top:14px;"><button class="tbtn" id="btnProSkip">跳过序章 ⏩</button></div>
    </div>
  </div>

  <!-- 结局 -->
  <div id="scrEnding" class="screen hidden">
    <h1>☀️ 太阳棱镜重燃！</h1>
    <p style="font-size:15px;color:#ffe9b0;line-height:1.9;">七座灯塔齐亮，暗影迷雾如潮水般退去……<br>光之国的每一寸土地，都重新洒满了光。</p>
    <div id="endRecap"></div>
    <div id="endSouyang">🏅 你已获得科学核心素养：<br>
      <b>科学观念</b> —— 掌握了光的传播规律　<b>科学思维</b> —— 学会预测与推理<br>
      <b>探究实践</b> —— 亲手完成每一次实验　<b>态度责任</b> —— 懂得安全用光、实事求是</div>
    <p style="color:#9fd0ff;font-size:13px;margin:10px 0;">🧪 已解锁【自由实验室】——去地图里随便玩光吧！</p>
    <button class="tbtn glow" id="btnEndMap" style="font-size:16px;padding:12px 30px;">🗺️ 回到七塔地图</button>
  </div>
</div>
<div id="modalLayer"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================
 * 《光的冒险》 Light Adventure
 * 教科版五上《光》单元教学游戏 · 单文件 · Canvas 2D
 * ===================================================== */
const W=900,H=600,DEG=Math.PI/180;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- 存档 ---------- */
const SAVE_KEY="lightAdventureSaveV1";
let SAVE={done:{},stars:{},cards:{},fails:{},allDone:false,prologueSeen:false};
try{const s=localStorage.getItem(SAVE_KEY);if(s)SAVE=Object.assign(SAVE,JSON.parse(s));}catch(e){}
SAVE.done=SAVE.done||{};SAVE.stars=SAVE.stars||{};SAVE.cards=SAVE.cards||{};SAVE.fails=SAVE.fails||{};
/* 老存档兼容：已有通关记录的玩家自动跳过序章 */
if(!SAVE.prologueSeen&&Object.keys(SAVE.done).length>0)SAVE.prologueSeen=true;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- 音效（WebAudio 小喇叭） ---------- */
let AC=null;
function beep(f,d=0.12,type="sine",vol=0.12){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sndOK=()=>{beep(660,.12);setTimeout(()=>beep(880,.15),110);setTimeout(()=>beep(1320,.2),230);};
const sndNo=()=>beep(160,.25,"sawtooth",0.08);
const sndPop=()=>beep(520,.07,"triangle",0.1);

/* ---------- 提示条 ---------- */
let toastTimer=null;
function toast(msg,ms=2200){
  const t=$("toast");t.innerHTML=msg;t.style.display="block";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",ms);
}

/* ---------- 星空背景 ---------- */
const STARS=[];for(let i=0;i<90;i++)STARS.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.4,p:Math.random()*6});

/* ================= 世界与关卡数据 ================= */

 {name:"微光觉醒",tower:"微光塔",blurb:"找到真正的光源，点亮第一缕光",sub:"什么是光源",icon:"🕯️",color:"#ffd166"},
 {name:"直线之道",tower:"直线塔",blurb:"光只会直直地飞，小孔对齐才放行",sub:"光沿直线传播",icon:"📏",color:"#8ecae6"},
 {name:"影之试炼",tower:"影之塔",blurb:"透明与不透明之间，藏着影子的秘密",sub:"阻挡与影子",icon:"🌑",color:"#cdb4db"},
 {name:"水之折射",tower:"水之塔",blurb:"光钻进水里会拐弯，别被眼睛骗了",sub:"光在水中拐弯",icon:"🐟",color:"#48cae4"},
 {name:"彩虹棱镜",tower:"彩虹塔",blurb:"白光里藏着彩虹，三原色能合成白光",sub:"色散与三原色",icon:"🌈",color:"#ff8fa3"},
 {name:"镜像回廊",tower:"镜像塔",blurb:"镜面反弹光，角度里藏着规矩",sub:"光的反射",icon:"🪞",color:"#90e0a8"},
 {name:"潜望之眼",tower:"棱镜塔",blurb:"太阳棱镜沉眠于此，最终决战之地",sub:"潜望镜·总决战",icon:"🔭",color:"#f4a261"},
];

/* kind 说明:
 findsrc=找光源  darkroom=照亮房间  eyereveal=光入眼
 boards=孔板直线  bellcorner=声音彩蛋  matslot=材料选择

const LEVELS=[
/* ============ W1 微光觉醒 ============ */
{id:"w1l1",w:0,k:0,name:"谁真的在发光",kind:"findsrc",
 storyIntro:"呜……太阳棱镜熄灭后，光之国黑得伸手不见五指！我叫<b>闪闪</b>，是你的光之精灵✨。想点亮第一座「微光塔」，得先找到<b>真正的光源</b>——就是那些自己正在发光的物体！",

{id:"w1l2",w:0,k:1,name:"点亮小黑屋",kind:"darkroom",

/* ================= 几何与光线追踪 ================= */
function raySegT(px,py,dx,dy,x1,y1,x2,y2){
  const ex=x2-x1,ey=y2-y1,den=dx*ey-dy*ex;
  if(Math.abs(den)<1e-9)return null;
  const t=((x1-px)*ey-(y1-py)*ex)/den;
  const u=((x1-px)*dy-(y1-py)*dx)/den;
  if(t>0.5&&u>=-0.001&&u<=1.001)return t;
  return null;
}
function rayCircleT(px,py,dx,dy,cx,cy,r){
  const ox=px-cx,oy=py-cy;
  const b=ox*dx+oy*dy,c=ox*ox+oy*oy-r*r;
  const disc=b*b-c;if(disc<0)return null;
  const t=-b-Math.sqrt(disc);
  return t>0.5?t:null;
}
function mirrorEnds(m){
  const c=Math.cos(m.a*DEG),s=Math.sin(m.a*DEG),h=m.len/2;
  return {x1:m.x-c*h,y1:m.y-s*h,x2:m.x+c*h,y2:m.y+s*h};
}
/* 场景对象求最近交点 */
function nearestHit(sc,x,y,a){
  const dx=Math.cos(a),dy=Math.sin(a);
  let best=null;
  const tryT=(t,info)=>{if(t!==null&&(!best||t<best.t))best=Object.assign({t},info);};
  // 画布边界
  let tb=1e9;
  if(dx>1e-9)tb=Math.min(tb,(W-x)/dx);if(dx<-1e-9)tb=Math.min(tb,(0-x)/dx);
  if(dy>1e-9)tb=Math.min(tb,(H-y)/dy);if(dy<-1e-9)tb=Math.min(tb,(0-y)/dy);
  best={t:tb,type:"bounds"};
  for(const m of sc.mirrors){const e=mirrorEnds(m);
    tryT(raySegT(x,y,dx,dy,e.x1,e.y1,e.x2,e.y2),{type:"mirror",m});}
  for(const wl of sc.walls){
    tryT(raySegT(x,y,dx,dy,wl.x1,wl.y1,wl.x2,wl.y2),{type:"wall"});}
  for(const b of sc.boards){
    if(Math.abs(dx)<1e-9)continue;
    const t=((b.x)-x)/dx; if(t<=0.5)continue;
    const iy=y+dy*t;
    // 挡板视为整面屏障（卡纸实验）：只有小孔能过，不能从板顶/板底绕过
    if(Math.abs(iy-b.y)<=b.hole/2)tryT(t,{type:"hole"});   // 穿过小孔
    else tryT(t,{type:"board"});                            // 被挡住
  }
  for(const p of sc.placedPlates()){
    if(Math.abs(dx)<1e-9)continue;
    const tL=(p.x-p.w/2-x)/dx,tR=(p.x+p.w/2-x)/dx;
    const t=Math.min(tL,tR);if(t<=0.5)continue;
    const iy=y+dy*t;
    if(Math.abs(iy-p.y)<=p.h/2)tryT(t,{type:"plate",p});
  }
  if(sc.water&&dy>1e-9){
    const t=(sc.water-y)/dy;
    if(t>0.5)tryT(t,{type:"water"});
  }
  for(const pr of sc.prisms){
    tryT(rayCircleT(x,y,dx,dy,pr.x,pr.y,pr.size),{type:"prism",pr});}
  for(const e of sc.eyes){
    tryT(rayCircleT(x,y,dx,dy,e.x,e.y,e.r),{type:"eye",e});}
  for(const tg of sc.targets){
    tryT(rayCircleT(x,y,dx,dy,tg.x,tg.y,tg.r),{type:"target",tg});}
  for(const f of sc.fishes){
    if(!f.caught)tryT(rayCircleT(x,y,dx,dy,f.rx,f.ry,26),{type:"fish",f});}
  return best;
}
/* 追踪一条光（可能因棱镜分光产生子光束） */
function traceRay(sc,x,y,a,color,alpha,depth,out){
  const pts=[{x,y}];let cx=x,cy=y,ca=a,cal=alpha;
  for(let i=0;i<12;i++){                    // 反射/折射步数上限：finale 潜望结构需要更多步；上限本身即防死循环
    const hit=nearestHit(sc,cx,cy,ca);
    if(!hit)break;
    const hx=cx+Math.cos(ca)*hit.t,hy=cy+Math.sin(ca)*hit.t;
    pts.push({x:hx,y:hy});
    if(hit.type==="bounds"||hit.type==="wall"||hit.type==="board")break;
    if(hit.type==="hole"){cx=hx+Math.cos(ca)*2;cy=hy+Math.sin(ca)*2;continue;}
    if(hit.type==="plate"){
      const mat=hit.p.mat;
      if(!mat||mat==="empty")break;                       // 空槽位挡光
      if(mat==="wood"){sc.shadows.push({x:hx,y:hy,a:ca});break;}
      if(mat==="stone")break;                             // 石板：不透明诱饵，挡光不留影子
      if(mat==="frost")cal*=0.55;
      cx=hx+Math.cos(ca)*2;cy=hy+Math.sin(ca)*2;continue;
    }
    if(hit.type==="water"){
      let dev=ca-Math.PI/2;
      const s=Math.sign(dev)||1;
      dev=s*Math.max(0,Math.abs(dev)-15*DEG);
      ca=Math.PI/2+dev;
      cx=hx+Math.cos(ca)*2;cy=hy+Math.sin(ca)*2;continue;
    }
    if(hit.type==="mirror"){
      ca=2*hit.m.a*DEG-ca;
      cx=hx+Math.cos(ca)*2;cy=hy+Math.sin(ca)*2;continue;
    }
    if(hit.type==="eye"){sc.eyeHit=true;sc.eyeHitFriendly=!!hit.e.friendly;break;}
    if(hit.type==="target"){
      const tg=hit.tg;
      if(!tg.color||tg.color===color){
        tg.glow=Math.max(tg.glow,cal);
        tg.lastColor=color;
      }
      break;
    }
    if(hit.type==="fish"){hit.f.justHit=true;break;}
    if(hit.type==="prism"){
      out.push({pts,color,alpha:cal,wide:cal<0.9});
      if(depth>=2)return;
      const pr=hit.pr,base=ca+35*DEG+pr.rot*DEG;
      const fan=[["red",-14],["green",0],["blue",14]];
      for(const [cn,off] of fan)
        traceRay(sc,pr.x,pr.y,base+off*DEG,cn,cal,depth+1,out);
      return;
    }
  }
  out.push({pts,color,alpha:cal,wide:cal<0.9});
}
function traceAll(sc){
  sc.shadows=[];sc.eyeHit=false;sc.eyeHitFriendly=false;
  for(const tg of sc.targets)tg.glow=0;
  for(const f of sc.fishes)f.justHit=false;
  const paths=[];
  if(sc.beamOn&&sc.src)
    traceRay(sc,sc.src.x,sc.src.y,sc.src.a*DEG,sc.srcColor||"white",1,0,paths);
  return paths;
}

const cv=$("cv"),ctx=cv.getContext("2d");
const BEAM_COLORS={white:"#fff3c4",warm:"#ffd98a",red:"#ff5a5a",green:"#5aff8a",blue:"#59b0ff"};
function drawBG(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.35,60,W/2,H/2,700);
  g.addColorStop(0,"#131c48");g.addColorStop(1,"#04060f");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of STARS){
    const a=0.35+0.65*Math.abs(Math.sin(t/700+s.p));
    ctx.fillStyle=`rgba(255,255,255,${a*0.8})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
}
function drawBeamPaths(paths){
  for(const p of paths){
    const col=BEAM_COLORS[p.color]||"#fff";
    ctx.save();
    ctx.lineJoin="round";ctx.lineCap="round";
    ctx.globalAlpha=0.22*p.alpha;ctx.strokeStyle=col;ctx.lineWidth=p.wide?12:14;
    ctx.shadowColor=col;ctx.shadowBlur=22;
    strokePts(p.pts);
    ctx.globalAlpha=0.95*p.alpha;ctx.lineWidth=p.wide?2.6:4;ctx.shadowBlur=10;
    strokePts(p.pts);
    ctx.restore();
  }
}
function strokePts(pts){
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
}
function emoji(e,x,y,size,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.font=size+"px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(e,x,y);ctx.restore();
}
function label(txt,x,y,size=13,color="#bcd"){
  ctx.save();ctx.font=size+"px sans-serif";ctx.textAlign="center";
  ctx.fillStyle=color;ctx.fillText(txt,x,y);ctx.restore();
}
function glowCircle(x,y,r,color,a){
  const g=ctx.createRadialGradient(x,y,2,x,y,r);
  g.addColorStop(0,color);g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
}
function drawWater(t){
  if(!SC.water)return;
  ctx.save();
  ctx.fillStyle="rgba(30,90,160,0.28)";
  ctx.fillRect(0,SC.water,W,H-SC.water);
  ctx.strokeStyle="rgba(120,200,255,0.9)";ctx.lineWidth=3;
  ctx.shadowColor="#4fc3f7";ctx.shadowBlur=12;
  ctx.beginPath();
  for(let x=0;x<=W;x+=12){
    const y=SC.water+Math.sin(x/28+t/300)*4;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.restore();
  label("💧 水面",40,SC.water-14,13,"#9fd8ff");
}
function drawMirror(m,hi){
  const e=mirrorEnds(m);
  ctx.save();

  ctx.lineCap="round";
  ctx.strokeStyle="rgba(180,220,255,.35)";ctx.lineWidth=11;ctx.beginPath();
  ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();
  ctx.strokeStyle="#dff1ff";ctx.lineWidth=5;ctx.shadowColor="#9fd0ff";ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();

function drawBoard(b,hi){

function drawPlate(p,small){

function drawPrism(pr,t,hi){

  if(hi)glowCircle(0,0,90,"rgba(255,220,120,.4)",1);

function drawScene(t){
  const sc=SC;if(!sc)return;
  drawBG(t);
  drawKind(t);
  // 通用器件
  for(const b of sc.boards)drawBoard(b,sc.hiId===b.id);
  for(const s of sc.slots)drawSlotFrame(s,sc.hiId===s.id);
  for(const s of sc.slots)if(s.mat)drawPlate({mat:s.mat,x:s.x,y:s.y,w:s.w,h:s.h});
  for(const p of sc.palette)if(!p.used)drawPlate({mat:p.mat,x:p.x,y:p.y,w:44,h:64},true);
  for(const wl of sc.walls){
    ctx.save();ctx.fillStyle="#2c3763";ctx.strokeStyle="#4a5b95";ctx.lineWidth=3;
    const wx=Math.min(wl.x1,wl.x2)-14,wy=Math.min(wl.y1,wl.y2);
    const ww=Math.abs(wl.x2-wl.x1)+28,wh=Math.abs(wl.y2-wl.y1)||600;
    ctx.fillRect(wl.x1-14,Math.min(wl.y1,wl.y2),28,Math.abs(wl.y2-wl.y1));
    ctx.strokeRect(wl.x1-14,Math.min(wl.y1,wl.y2),28,Math.abs(wl.y2-wl.y1));
    ctx.restore();label("高墙",wl.x1,Math.min(wl.y1,wl.y2)-16,13,"#8aa5d8");}
  for(const m of sc.mirrors)drawMirror(m,sc.hiId===m.id);
  for(const pr of sc.prisms)drawPrism(pr,t,sc.hiId==="prism");
  for(const e of sc.eyes)drawEye(e,t,!!e.friendly);
  for(const tg of sc.targets)if(tg.icon!=="🚪"||sc.kind==="wheel")drawTarget(tg,t);
  drawShadows();
  // 光束
  const paths=traceAll(sc);
  drawBeamPaths(paths);
  if(["boards","matslot","mirrors","periscope","prismcrystal","finale","sandbox"].includes(sc.kind))
    drawSrc(t);
  // 眼睛命中反馈
  if(sc.eyeHit){
    label("⚠️ 激光笔的光不能照射眼睛！",W/2,H-58,18,"#ff7070");
  }
  sc.lastPaths=paths;
}

/* ================= 交互（鼠标+触屏） ================= */
function evPos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function segDist(px,py,m){
  const e=mirrorEnds(m);
  const dx=e.x2-e.x1,dy=e.y2-e.y1,L2=dx*dx+dy*dy;
  let u=((px-e.x1)*dx+(py-e.y1)*dy)/L2;u=clamp(u,0,1);
  return dist(px,py,e.x1+u*dx,e.y1+u*dy);
}
function countFail(){
  const id=SC.lv.id;
  SC.fails++;SAVE.fails[id]=SC.fails;save();
  if(SC.fails>=5)$("btnDemo").disabled=false;
  updateInfo();
}
/* 命中半径随画布缩放：手机小屏放大触控命中区（至少约24 CSS px） */
function hitR(base){try{const r=cv.getBoundingClientRect();const s=r.width/W;
  return Math.max(base,24/Math.max(0.2,s||1));}catch(e){return base;}}
/* 摆放容差按画布缩放：小屏放大到约 18 CSS px 等效 */
function cssTol(base){try{const r=cv.getBoundingClientRect();const s=r.width/W;
  return Math.max(base,18/Math.max(0.2,s||1));}catch(e){return base;}}
/* 拖拽被意外中断时归还材料，防止材料丢失卡关 */
function cancelDrag(sc){
  const d=sc.drag;if(!d)return;
  if(d.type==="plate"){if(d.from)d.from.used=false;}
  else if(d.type==="plateOut"){
    if(d.slot&&!d.slot.mat)d.slot.mat=d.mat;
    else{const pl=sc.palette.find(x=>x.mat===d.mat);if(pl)pl.used=false;}
  }
  sc.drag=null;sc.dragPid=null;
}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();if(!SC||SC.won)return;
  const p=evPos(e),sc=SC,c=sc.custom;
  if(sc.demoQ)return;                        // 光路演示期间锁定操作
  if(sc.drag&&sc.dragPid!=null&&e.pointerId!==sc.dragPid)return; // 多指冲突：忽略非主指针
  cancelDrag(sc);                            // 上次手势异常中断：先归还材料
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  sc.dragPid=e.pointerId;
  // 1) 旋转把手
  if(sc.src&&sc.src.handle&&dist(p.x,p.y,sc.src.handle.x,sc.src.handle.y)<hitR(22)&&sc.src.rotatable&&!sc.src.hidden)
    {sc.drag={type:"rotSrc"};return;}
  if(sc.src&&sc.src.rotOnly&&sc.src.handle&&dist(p.x,p.y,sc.src.handle.x,sc.src.handle.y)<hitR(22))
    {sc.drag={type:"rotSrc"};return;}
  for(const pr of sc.prisms)
    if(pr.handle&&dist(p.x,p.y,pr.handle.x,pr.handle.y)<hitR(22)){sc.drag={type:"rotPrism",pr};return;}
  for(const m of sc.mirrors)
    if(!m.fixed&&m.handle&&dist(p.x,p.y,m.handle.x,m.handle.y)<hitR(22)){sc.drag={type:"rotMir",m};return;}
  // 2) 各玩法的点击目标
  if(sc.kind==="findsrc"){
    for(const o of sc.objects)if(dist(p.x,p.y,o.x,o.y)<48){
      if(o.src){if(!o.found){o.found=true;sndOK();toast("🎉 "+o.msg);}}
      else{o.shake=20;sndNo();toast("🙅 "+o.msg);countFail();}
      checkWin();return;}
    return;}
  if(sc.kind==="darkroom"){
    const door=c.door;
    if(door.reveal>0.6&&dist(p.x,p.y,door.x,door.y)<60){door.open=true;sndOK();checkWin();return;}
    if(dist(p.x,p.y,c.lamp.x,c.lamp.y)<56){sc.drag={type:"lamp"};return;}
    return;}
  if(sc.kind==="eyereveal"){
    if(c.lit)for(const s of c.stars)
      if(s.vis>0.8&&!s.got&&dist(p.x,p.y,s.x,s.y)<40){s.got=true;sndPop();checkWin();return;}
    return;}
  if(sc.kind==="bellcorner"){
    if(dist(p.x,p.y,c.torch.x,c.torch.y)<52){
      c.tried=true;c.beamAnim=50;sndNo();
      toast("光沿直线传播，拐不了弯，被墙挡住了！");countFail();return;}
    if(dist(p.x,p.y,c.bell.x,c.bell.y)<52){
      if(c.ringing)return;
      c.ringing=true;c.ringT=0;sndPop();
      toast("🔔 叮铃铃——声波绕过拐角啦！");return;}
    return;}
  if(sc.kind==="eclipse"){
    for(const b of sc.bodies)if(dist(p.x,p.y,b.x,b.y)<b.r+18){sc.drag={type:"body",b};return;}
    return;}
  if(sc.kind==="wheel"){
    if(dist(p.x,p.y,c.wheel.x,c.wheel.y)<c.wheel.r+14){
      c.wheel.speed=Math.min(16,c.wheel.speed+3.4);sndPop();return;}
    return;}
  if(sc.kind==="finale"&&!c.sunOn){
    if(dist(p.x,p.y,c.sun.x,c.sun.y)<50){c.sunOn=true;sndOK();
      toast("☀️ 对！太阳自己发光，是真正的光源！");return;}
    if(dist(p.x,p.y,c.moon.x,c.moon.y)<46){sndNo();countFail();
      toast("🌙 月亮只是反射太阳光，不是光源哦！");return;}
    return;}
  // 3) 材料板：从调色板拖出 / 从槽位移除
  for(const pl of sc.palette)
    if(!pl.used&&Math.abs(p.x-pl.x)<hitR(34)&&Math.abs(p.y-pl.y)<hitR(46)){
      sc.drag={type:"plate",mat:pl.mat,from:pl,px:p.x,py:p.y};return;}
  for(const s of sc.slots)
    if(s.mat&&Math.abs(p.x-s.x)<hitR(s.w/2+10)&&Math.abs(p.y-s.y)<s.h/2+14){
      sc.drag={type:"plateOut",slot:s,mat:s.mat,px:p.x,py:p.y};s.mat=null;return;}
  // 4) 器件本体
  if(sc.src&&sc.src.moveAxis&&dist(p.x,p.y,sc.src.x,sc.src.y)<hitR(36)){sc.drag={type:"src"};return;}
  for(const pr of sc.prisms)if(pr.dragMove&&dist(p.x,p.y,pr.x,pr.y)<hitR(pr.size+10)){sc.drag={type:"prismMove",pr};return;}
  for(const b of sc.boards)
    if(Math.abs(p.x-b.x)<hitR(26)&&Math.abs(p.y-b.y)<b.h/2+14){sc.drag={type:"board",b};return;}
  for(const m of sc.mirrors)
    if(segDist(p.x,p.y,m)<hitR(20)){sc.drag={type:"mirror",m};return;}
});
cv.addEventListener("pointermove",e=>{
  if(!SC||!SC.drag)return;e.preventDefault();
  if(SC.dragPid!=null&&e.pointerId!==undefined&&e.pointerId!==SC.dragPid)return;
  const p=evPos(e),d=SC.drag;
  if(d.type==="rotSrc"){const s=SC.src;
    s.a=clamp(Math.atan2(p.y-s.y,p.x-s.x)/DEG,s.amin??-180,s.amax??180);}
  else if(d.type==="rotPrism"){d.pr.rot=Math.atan2(p.y-d.pr.y,p.x-d.pr.x)/DEG+90;}
  else if(d.type==="rotMir"){d.m.a=Math.atan2(p.y-d.m.y,p.x-d.m.x)/DEG;}
  else if(d.type==="lamp"){SC.custom.lamp.x=clamp(p.x,30,W-30);SC.custom.lamp.y=clamp(p.y,30,H-30);}
  else if(d.type==="body"){d.b.x=clamp(p.x,70,W-70);d.b.y=clamp(p.y,240,360);}
  else if(d.type==="src"){const s=SC.src;
    if(s.moveAxis==="x")s.x=clamp(p.x,60,W-60);
    else if(s.moveAxis==="xy"){s.x=clamp(p.x,40,W-40);s.y=clamp(p.y,40,H-40);}}
  else if(d.type==="prismMove"){d.pr.x=clamp(p.x,60,W-60);d.pr.y=clamp(p.y,60,H-60);}
  else if(d.type==="board"){d.b.y=clamp(p.y,70,H-70);}
  else if(d.type==="mirror"){d.m.x=clamp(p.x,40,W-40);d.m.y=clamp(p.y,40,H-40);}
  else if(d.type==="plate"||d.type==="plateOut"){d.px=p.x;d.py=p.y;}
});
cv.addEventListener("pointerup",e=>{
  if(!SC||!SC.drag)return;
  if(SC.dragPid!=null&&e.pointerId!==undefined&&e.pointerId!==SC.dragPid)return;
  const d=SC.drag,p=evPos(e);

      if(!s.mat){s.mat=d.mat;d.from.used=true;ok=true;sndPop();}

    if(!ok)toast("把材料拖到虚线框里哦");
  }else if(d.type==="plateOut"){
    let ok=false;
    for(const s of SC.slots)if(Math.abs(p.x-s.x)<60&&Math.abs(p.y-s.y)<s.h/2+30){

    if(!ok){ // 放回调色板

  }
  SC.drag=null;SC.dragPid=null;
});
cv.addEventListener("pointercancel",e=>{

    if(!hit){sndNo();countFail();
      if(c.shotsMax<90&&c.shots<=0){toast("机会用完，鱼群受惊游走了！重新开始本关");c.shots=c.shotsMax;
        for(const f of sc.fishes){f.caught=false;f.jump=0;}}
      else toast("没叉中……记住：光进水会向下偏折，瞄低一点！");}
    updateInfo();checkWin();return;
  }
  sc.beamOn=!sc.beamOn;
  $("btnFire").textContent=sc.beamOn?"🛑 收回光束":"🔦 发射光束";
  if(sc.beamOn){
    sc.eyeWarned=false;sc.attempts++;
    traceAll(sc);
    afterTraceCheck();
  }
}
function afterTraceCheck(){
  const sc=SC;
  if(sc.eyeHit&&!sc.eyeWarned&&!sc.eyeHitFriendly){
    sc.eyeWarned=true;sndNo();countFail();
    toast("⚠️ 危险！激光笔的光不能照射眼睛！快调整光路");
  }
  // 是否命中任何目标
  const anyGlow=sc.targets.some(t=>t.glow>0.05);
  if(sc.beamOn&&!anyGlow&&!sc.eyeHit&&["boards","matslot","mirrors","periscope","prismcrystal","finale"].includes(sc.kind)){
    countFail();
    toast("光束没有到达目标……观察它停在了哪里？");
  }
  checkWin();
}
function checkWin(){
  const sc=SC;if(!sc||sc.won)return;
  const c=sc.custom;let win=false;
  switch(sc.kind){
    case "findsrc":win=sc.objects.filter(o=>o.src).every(o=>o.found);break;
    case "darkroom":win=!!c.door.open;break;
    case "eyereveal":win=c.lit&&c.stars.every(s=>s.got);break;
    case "bellcorner":win=!!c.bird.awake;break;
    case "eclipse":win=c.phase>=2;break;
    case "fish":win=sc.fishes.every(f=>f.caught);break;
    case "wheel":win=!!c.doorOpen;break;
    default:
      win=sc.beamOn&&!sc.eyeHit&&sc.targets.length>0&&sc.targets.every(t=>t.lit);
      if(sc.kind==="finale")win=win&&c.sunOn;
  }
  if(win)winLevel();
}
/* 每帧推进：目标点亮锁存 / 转盘 / 眼睛显现 / 演示步进 */
function tickLogic(){
  const sc=SC;if(!sc)return;
  const c=sc.custom;sc.t++;
  for(const tg of sc.targets)if(tg.glow>=(tg.need||0.5))tg.lit=true;
  if(sc.kind==="eyereveal"){
    if(sc.beamOn&&sc.eyeHit&&!c.lit){c.lit=true;sndOK();
      toast("👁️ 光进入眼睛了！你看见了隐藏的星星！");}
    for(const s of c.stars)if(c.lit&&s.vis<1)s.vis=Math.min(1,s.vis+0.05);
  }
  if(sc.kind==="wheel"){
    c.wheel.speed*=0.985;c.wheel.ang+=c.wheel.speed*0.03;
    if(sc.beamOn&&sc.targets[0].lit)c.doorOpen=true;
    checkWin();
  }
  if(sc.kind==="bellcorner"&&c.ringing){
    c.ringT++;
    if(c.ringT%10===0)c.rings.push({x:c.bell.x,y:c.bell.y,r:10,a:1});
    for(const r of c.rings){r.r+=6;r.a=1-r.r/560;
      // 声波绕墙：到达小鸟
      if(dist(r.x+r.r*0.7,r.y,c.bird.x,c.bird.y)<r.r&&!c.bird.awake&&r.r>500){c.bird.awake=true;}}
    c.rings=c.rings.filter(r=>r.a>0);
    if(c.ringT>95){c.ringing=false;if(!c.bird.awake)c.bird.awake=true;}
    if(c.bird.awake){sndOKOnce();checkWin();}
  }
  if(sc.flash>0){sc.flash--;if(sc.flash===0)sc.beamOn=false;}
  if(["boards","matslot","mirrors","periscope","prismcrystal","finale","sandbox"].includes(sc.kind)&&sc.beamOn){
    if(sc.eyeHit&&!sc.eyeWarned&&!sc.eyeHitFriendly){sc.eyeWarned=true;sndNo();countFail();
      toast("⚠️ 危险！激光笔的光不能照射眼睛！");}
    checkWin();
  }
  if(sc.kind==="prismcrystal"&&sc.beamOn){
    const ts=sc.targets;
    if(c.stage===0&&ts[0].lit){c.stage=1;
      if(ts.length>1)toast("💎 红水晶点亮！现在把蓝光转向蓝水晶～");}
  }

}

/* ================= 光路演示（看答案） ================= */
function solveFishAim(f){
  const sc=SC,s=sc.src,wy=sc.water;
  for(let a=16;a<=164;a+=1){
    const ar=a*DEG,sa=Math.sin(ar);if(sa<0.25)continue;
    const run=(wy-s.y)*Math.cos(ar)/sa;
    for(let x=60;x<=840;x+=4){
      const ex=x+run;
      const dev=a-90,d2=90+Math.sign(dev)*Math.max(0,Math.abs(dev)-15);
      const dx=Math.cos(d2*DEG),dy=Math.sin(d2*DEG);
      const vx=f.rx-ex,vy=f.ry-wy,t=vx*dx+vy*dy;
      if(t>10&&Math.abs(vx*dy-vy*dx)<24)return {x,a};
    }
  }
  return null;
}
function startDemo(){
  const sc=SC;if(!sc||sc.won||sc.demoQ)return;
  sc.demoUsed=true;const c=sc.custom,S=[];
  const P=(fn,waitFor)=>S.push({fn,waitFor});
  switch(sc.kind){
    case "findsrc":
      sc.objects.filter(o=>o.src).forEach(o=>P(()=>{o.found=true;sndPop();checkWin();}));break;
    case "darkroom":
      P(()=>{c.lamp.x=560;c.lamp.y=430;});
      P(()=>{c.lamp.x=735;c.lamp.y=430;});
      P(()=>{c.door.open=true;sndOK();checkWin();},()=>c.door.reveal>0.6);break;
    case "eyereveal":
      P(()=>{const e=c.eye;sc.src.a=Math.atan2(e.y-sc.src.y,e.x-sc.src.x)/DEG;sc.beamOn=true;});
      c.stars.forEach(s=>P(()=>{s.got=true;sndPop();checkWin();},()=>s.vis>0.8));break;
    case "bellcorner":
      P(()=>{c.ringing=true;c.ringT=0;});break;
    case "boards":
      sc.boards.forEach(b=>P(()=>{b.y=b.sol;sndPop();}));
      P(()=>{sc.beamOn=true;$("btnFire").textContent="🛑 收回光束";});break;
    case "matslot":
      P(()=>{sc.slots[0].mat="glass";sc.palette.find(p=>p.mat==="glass").used=true;sndPop();});
      if(sc.slots[1])P(()=>{sc.slots[1].mat="frost";sc.palette.find(p=>p.mat==="frost").used=true;sndPop();});
      P(()=>{sc.beamOn=true;$("btnFire").textContent="🛑 收回光束";});break;
    case "eclipse":
      P(()=>{const[su,mo,ea]=sc.bodies;su.x=180;mo.x=450;ea.x=720;
        sc.bodies.forEach(b=>b.y=300);});
      P(()=>{const[su,mo,ea]=sc.bodies;su.x=180;ea.x=450;mo.x=720;
        sc.bodies.forEach(b=>b.y=300);},()=>c.phase===1);break;
    case "fish":
      sc.fishes.forEach(f=>P(()=>{
        const sol=solveFishAim(f);
        if(sol){sc.src.x=sol.x;sc.src.a=sol.a;}
        sc.beamOn=true;traceAll(sc);
        for(const ff of sc.fishes)if(ff.justHit&&!ff.caught){ff.caught=true;ff.jump=40;sndPop();}
        checkWin();
      },()=>!f.caught));break;
    case "prismcrystal":
      P(()=>{sc.prisms[0].rot=sc.prisms[0].sol;sc.beamOn=true;$("btnFire").textContent="🛑 收回光束";});
      if(sc.targets[1])P(()=>{sc.prisms[0].rot=sc.prisms[0].sol2;},()=>sc.targets[0].lit);break;
    case "wheel":
      P(()=>{c.wheel.speed=15;});P(()=>{c.wheel.speed=15;});P(()=>{c.wheel.speed=15;});break;
    case "mirrors":case "periscope":
      sc.mirrors.forEach(m=>{if(m.sol)P(()=>{m.x=m.sol.x;m.y=m.sol.y;m.a=m.sol.a;sndPop();});});
      P(()=>{sc.beamOn=true;$("btnFire").textContent="🛑 收回光束";});break;
    case "finale":
      P(()=>{c.sunOn=true;sndPop();});
      sc.boards.forEach(b=>P(()=>{b.y=b.sol;sndPop();}));
      P(()=>{sc.slots[0].mat="glass";sc.palette.find(p=>p.mat==="glass").used=true;sndPop();});
      P(()=>{sc.prisms[0].rot=sc.prisms[0].sol;sndPop();});
      sc.mirrors.forEach(m=>{if(m.sol)P(()=>{m.x=m.sol.x;m.y=m.sol.y;m.a=m.sol.a;sndPop();});});
      P(()=>{sc.beamOn=true;$("btnFire").textContent="🛑 收回光束";});break;
  }
  sc.demoQ=S;sc.demoIdx=0;sc.demoT=10;
  toast("🎬 看仔细咯——光路演示开始！");
}
function runDemoTick(){
  const sc=SC;if(!sc||!sc.demoQ)return;
  const step=sc.demoQ[sc.demoIdx];
  if(!step){sc.demoQ=null;return;}
  if(step.waitFor&&!step.waitFor())return;
  if(sc.demoT>0){sc.demoT--;return;}
  step.fn();sc.demoIdx++;sc.demoT=45;
}

function pressHint(){

function applyFirstStep(){
  const sc=SC,c=sc.custom;
  switch(sc.kind){
    case "boards":sc.boards[0].y=sc.boards[0].sol;break;
    case "matslot":if(!sc.slots[0].mat){sc.slots[0].mat="glass";
      const p=sc.palette.find(x=>x.mat==="glass");if(p)p.used=true;}break;
    case "mirrors":case "periscope":{const m=sc.mirrors[0];
      m.x=m.sol.x;m.y=m.sol.y;m.a=m.sol.a;break;}
    case "prismcrystal":sc.prisms[0].rot=sc.prisms[0].sol;break;
    case "finale":c.sunOn=true;break;
    case "fish":{const f=sc.fishes.find(f=>!f.caught);
      if(f){const s=solveFishAim(f);if(s){sc.src.x=s.x;sc.src.a=s.a;}}break;}
    case "eyereveal":{const e=c.eye;
      sc.src.a=Math.atan2(e.y-sc.src.y,e.x-sc.src.x)/DEG;break;}
    case "darkroom":c.lamp.x=640;c.lamp.y=430;break;
    case "eclipse":{const[su,mo,ea]=sc.bodies;su.x=180;su.y=300;
      if(c.phase===0){mo.x=450;mo.y=300;}else{ea.x=450;ea.y=300;}break;}
  }
}

/* 星级：3星=不用提示/演示 + 发射≤2次 + 预测答对；2星=用1级提示或发射≤4次；其余1星 */
function calcStars(sc){
  const att=sc.attempts||0;
  if(sc.hintLevel===0&&!sc.demoUsed&&att<=2&&sc.predictOK===true)return 3;
  if((sc.hintLevel===1&&!sc.demoUsed)||att<=4)return 2;
  return 1;
}

function finalizeWin(){

/* ================= 主循环 ================= */
function fitCanvas(){
  const wrap=$("canvasWrap");
  const aw=wrap.clientWidth-10,ah=wrap.clientHeight-10;
  const s=Math.max(0.2,Math.min(aw/W,ah/H));
  cv.style.width=(W*s)+"px";cv.style.height=(H*s)+"px";
  // devicePixelRatio 高清适配：画布按 dpr 放大，逻辑坐标仍用 W×H
  const dpr=Math.min(3,(window.devicePixelRatio||1));
  const bw=Math.round(W*dpr),bh=Math.round(H*dpr);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
  try{ctx.setTransform(dpr,0,0,dpr,0,0);}catch(e){}
}
window.addEventListener("resize",fitCanvas);
let lastT=0;
function loop(t){
  if(SC&&!$("scrGame").classList.contains("hidden")){
    tickLogic();
    drawScene(t);
    if(SC.drag&&(SC.drag.type==="plate"||SC.drag.type==="plateOut"))
      drawPlate({mat:SC.drag.mat,x:SC.drag.px,y:SC.drag.py,w:44,h:64},true);
  }
  requestAnimationFrame(loop);
}
renderMap();fitCanvas();

  $("scrMap").classList.add("hidden");
  $("scrPrologue").classList.remove("hidden");
  proIdx=0;renderPro();
}
requestAnimationFrame(loop);
